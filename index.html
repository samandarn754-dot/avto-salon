<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Avto Salon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>GM Avto Salon</h1>

  <div class="car-grid">
    <div class="car-card">
      <img src="images/malibu.jpg" alt="Chevrolet Malibu">
      <h3>Chevrolet Malibu</h3>
      <button class="analyze-btn" data-image="images/malibu.jpg">AI tahlili</button>
    </div>

    <div class="car-card">
      <img src="images/camaro.jpg" alt="Chevrolet Camaro">
      <h3>Chevrolet Camaro</h3>
      <button class="analyze-btn" data-image="images/camaro.jpg">AI tahlili</button>
    </div>

    <div class="car-card">
      <img src="images/escalade.jpg" alt="Cadillac Escalade">
      <h3>Cadillac Escalade</h3>
      <button class="analyze-btn" data-image="images/escalade.jpg">AI tahlili</button>
    </div>

    <div class="car-card">
      <img src="images/enclave.jpg" alt="Buick Enclave">
      <h3>Buick Enclave</h3>
      <button class="analyze-btn" data-image="images/enclave.jpg">AI tahlili</button>
    </div>

    <div class="car-card">
      <img src="images/sierra.jpg" alt="GMC Sierra">
      <h3>GMC Sierra</h3>
      <button class="analyze-btn" data-image="images/sierra.jpg">AI tahlili</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
